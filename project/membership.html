<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership - Odyssey Fitness</title>
  <meta name="description" content="Compare Odyssey Fitness membership plans and sign up for a free trial or membership consultation.">
  <meta name="author" content="Eduardo Baez">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Oswald:wght@500;700&display=optional">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Oswald:wght@500;700&display=optional" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Oswald:wght@500;700&display=optional">
  </noscript>

  <link rel="stylesheet" href="styles/style.css">
  <script src="scripts/main.js" defer></script>
  <script src="scripts/membership.js" defer></script>
</head>
<body>

  <header>
    <p class="site-title">Odyssey Fitness</p>
    <button id="menu-button" aria-label="Toggle navigation menu">&#9776;</button>
    <nav id="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="classes.html">Classes &amp; Schedule</a></li>
        <li><a href="membership.html">Membership</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <h1>Membership Plans</h1>
    <p>Choose the plan that fits your fitness goals and budget.</p>

    <div id="plans"></div>

    <section id="signup">
      <h2>Sign Up for a Free Trial or Consultation</h2>
      <p id="welcome-back"></p>

      <form id="signup-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="plan">Selected Plan</label>
        <select id="plan" name="plan" required>
          <option value="">-- Select a plan --</option>
          <option value="Basic">Basic - $29/month</option>
          <option value="Standard">Standard - $49/month</option>
          <option value="Premium">Premium - $79/month</option>
        </select>

        <label for="message">Message (optional)</label>
        <textarea id="message" name="message" rows="4"></textarea>

        <button type="submit">Submit</button>
      </form>

      <p id="form-confirmation"></p>
    </section>

  </main>

  <footer>
    <p>&copy; <span id="year"></span> Eduardo Baez</p>
    <p><span id="last-modified"></span></p>
    <p><a href="references.html">References</a></p>
  </footer>

</body>
</html>
