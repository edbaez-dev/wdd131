<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form</title>
  <meta name="description" content="Submit a review for your recently installed product.">
  <meta name="author" content="Eduardo Baez">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
  <script src="scripts/getdates.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form id="review-form" method="get" action="review.html">

      <div class="form-group">
        <label for="product-name">Product Name</label>
        <select id="product-name" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
          <!-- Options are injected dynamically by form.js -->
        </select>
      </div>

      <div class="form-group">
        <p>Overall Rating *</p>
        <div class="rating-stars">
            <div class="rating-item">
                <label for="rating-1">&star;</label>
                <input type="radio" id="rating-1" name="rating" value="1" required>
            </div>
            <div class="rating-item">
                <label for="rating-2">&star;&star;</label>
                <input type="radio" id="rating-2" name="rating" value="2" required>
            </div>
            <div class="rating-item">
                <label for="rating-3">&star;&star;&star;</label>
                <input type="radio" id="rating-3" name="rating" value="3" required>
            </div>
            <div class="rating-item">
                <label for="rating-4">&star;&star;&star;&star;</label>
                <input type="radio" id="rating-4" name="rating" value="4" required>
            </div>
            <div class="rating-item">
                <label for="rating-5">&star;&star;&star;&star;&star;</label>
                <input type="radio" id="rating-5" name="rating" value="5" required>
            </div>
        </div>
    </div>

      <div class="form-group">
        <label for="install-date">Date of Installation *</label>
        <input type="date" id="install-date" name="installDate" required>
      </div>

      <div class="form-group">
        <p>Which features did you find useful in the product?</p>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="feature-durability" name="features" value="Durability">
            <label for="feature-durability">Durability</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="feature-ease" name="features" value="Ease of Use">
            <label for="feature-ease">Ease of Use</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="feature-performance" name="features" value="Performance">
            <label for="feature-performance">Performance</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="feature-design" name="features" value="Design">
            <label for="feature-design">Design</label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="written-review">Written Review (Optional)</label>
        <textarea id="written-review" name="writtenReview"></textarea>
      </div>

      <div class="form-group">
        <label for="user-name">Your Name (Optional)</label>
        <input type="text" id="user-name" name="userName">
      </div>

      <div class="form-group">
        <input type="submit" value="Post Review">
      </div>

    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Eduardo Baez</p>
    <p><span id="lastModified"></span></p>
  </footer>
</body>
</html>
